<!--
  SIH 26171 — PRIVYSE architecture (v2)
  On-device Visual Perception for Light-weight Browser Agents
  Vector master. Insert directly into PowerPoint / Keynote / Google Slides.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1140" viewBox="0 0 1480 1140" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#283593"/>
    </marker>
    <marker id="arred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b62835"/>
    </marker>
    <marker id="arblu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/>
    </marker>
    <marker id="argrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="740" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">PRIVYSE — On-device Visual Perception for Light-weight Browser Agents</text>
  <line x1="740" y1="44" x2="740" y2="56" stroke="#283593" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ============ EXTENSION BAND ============ -->
  <rect x="46" y="58" width="1368" height="552" rx="14" fill="#eef1fb" stroke="#283593" stroke-width="2.5"/>
  <text x="66" y="84" font-size="15" font-weight="bold" fill="#283593">CHROME EXTENSION — on your machine (WXT · TypeScript · Chrome MV3)</text>

  <!-- side panel -->
  <rect x="62" y="100" width="252" height="140" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.5"/>
  <text x="78" y="124" font-size="13.5" font-weight="bold" fill="#111">SIDE PANEL (UI)</text>
  <text x="78" y="146" font-size="12" fill="#222">task input · run-one-step · stop</text>
  <text x="78" y="164" font-size="12" fill="#222">live activity log · capture preview</text>
  <text x="78" y="182" font-size="12" fill="#222">GATE node · GATE PASS / BLOCKED flash</text>
  <text x="78" y="200" font-size="12" fill="#222">VLM &#8220;thinking&#8221; via SSE</text>
  <text x="78" y="218" font-size="12" fill="#222">AI View · Privacy Lens · orb</text>

  <!-- background orchestrator -->
  <rect x="62" y="252" width="252" height="250" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.5"/>
  <text x="78" y="276" font-size="13.5" font-weight="bold" fill="#111">BACKGROUND ORCHESTRATOR</text>
  <text x="78" y="298" font-size="12" fill="#222">step scheduler (throttled)</text>
  <text x="78" y="315" font-size="12" fill="#222">captureVisibleTab → privacy gate</text>
  <text x="78" y="332" font-size="12" fill="#222">POST /act → apply JSON action</text>
  <text x="78" y="349" font-size="12" fill="#222">stuck / no-progress detection</text>
  <text x="78" y="366" font-size="12" fill="#222">→ /rethink structural recovery</text>
  <text x="78" y="383" font-size="12" fill="#222">per-host lesson memory</text>
  <text x="78" y="400" font-size="12" fill="#222">within-run DO-NOT-REPEAT set</text>
  <text x="78" y="417" font-size="12" fill="#222">perception same-page cache (LRU)</text>
  <text x="78" y="434" font-size="12" fill="#222">verified-target memory</text>

  <!-- arrows (side panel <-> orchestrator, orchestrator -> vision) -->
  <line x1="188" y1="240" x2="188" y2="250" stroke="#283593" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="314" y1="352" x2="336" y2="352" stroke="#283593" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="314" y1="170" x2="336" y2="170" stroke="#283593" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 1 capture -->
  <rect x="338" y="100" width="220" height="140" rx="8" fill="#ffffff" stroke="#283593" stroke-width="2"/>
  <text x="354" y="124" font-size="13.5" font-weight="bold" fill="#283593">1  CAPTURE</text>
  <text x="354" y="146" font-size="12" fill="#222">captureVisibleTab → JPEG</text>
  <text x="354" y="164" font-size="12" fill="#222">DOM walker → numbered list</text>
  <text x="354" y="182" font-size="12" fill="#222">  ≤ 120 elements</text>
  <text x="354" y="200" font-size="12" fill="#222">  id · label · role · value</text>
  <text x="354" y="218" font-size="12" fill="#222">bbox × devicePixelRatio · pixel-hash</text>
  <line x1="558" y1="170" x2="580" y2="170" stroke="#283593" stroke-width="2" marker-end="url(#ar)"/>

  <!-- offscreen vision host -->
  <rect x="338" y="252" width="220" height="240" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.5"/>
  <text x="354" y="276" font-size="13" font-weight="bold" fill="#111">OFFSCREEN VISION HOST</text>
  <text x="354" y="296" font-size="12" fill="#222">offscreen document (MV3)</text>
  <text x="354" y="313" font-size="12" fill="#222">MediaPipe BlazeFace → faces</text>
  <text x="354" y="330" font-size="12" fill="#222">  → crushed-blur (no recovery)</text>
  <text x="354" y="347" font-size="12" fill="#222">Tesseract.js OCR (WASM, eng)</text>
  <text x="354" y="364" font-size="12" fill="#222">  img / canvas / video only</text>
  <text x="354" y="381" font-size="12" fill="#222">region-restricted label rules</text>
  <text x="354" y="398" font-size="12" fill="#222">  (account / ifsc)</text>
  <text x="354" y="417" font-size="12" fill="#222">weights bundled 2.2 MB — no CDN</text>
  <text x="354" y="436" font-size="12" fill="#222">runs in parallel with ViT</text>
  <text x="354" y="455" font-size="11.5" font-weight="bold" fill="#111">~0.3 s on-device per step</text>
  <line x1="558" y1="330" x2="580" y2="330" stroke="#283593" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2 sanitize -->
  <rect x="582" y="100" width="360" height="240" rx="8" fill="#ffffff" stroke="#283593" stroke-width="2"/>
  <text x="598" y="124" font-size="13.5" font-weight="bold" fill="#283593">2  SANITIZE — PRIVACY CHOKE POINT</text>
  <text x="598" y="146" font-size="12" fill="#222">Tier A  password / secret / CVV / API-key</text>
  <text x="598" y="164" font-size="12" fill="#222">      → solid black box, no text</text>
  <text x="598" y="182" font-size="12" fill="#222">Tier B  regex PII → stable token:</text>
  <text x="598" y="200" font-size="12" fill="#222">      [EMAIL_1] [AADHAAR_1] [PAN_1] [CARD_1]</text>
  <text x="598" y="218" font-size="12" fill="#222">      same value ⇒ same token</text>
  <text x="598" y="238" font-size="12" fill="#222">Tier C  face blur + OCR taint regions</text>
  <text x="598" y="258" font-size="12" fill="#222">      auto-escalated by on-device perception</text>
  <text x="598" y="280" font-size="12" fill="#222">fail-closed: nothing unredacted can leave</text>
  <line x1="762" y1="340" x2="762" y2="350" stroke="#283593" stroke-width="2" marker-end="url(#ar)"/>

  <!-- on-device VIT perception -->
  <rect x="966" y="100" width="322" height="240" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="982" y="124" font-size="13.5" font-weight="bold" fill="#7c3aed">ON-DEVICE ViT PERCEPTION</text>
  <text x="982" y="146" font-size="12" fill="#222">MobileViT-Small q8 ONNX (6.3 MB)</text>
  <text x="982" y="163" font-size="12" fill="#222">onnxruntime-web (13.3 MB) — in-browser</text>
  <text x="982" y="182" font-size="12" fill="#222">semantic tile map: photo / ui /</text>
  <text x="982" y="199" font-size="12" fill="#222">  document / data / blank</text>
  <text x="982" y="218" font-size="12" fill="#222">escalates non-DOM graphics → Tier C blur</text>
  <text x="982" y="237" font-size="12" fill="#222">ships compact ON-DEVICE PERCEPTION</text>
  <text x="982" y="254" font-size="12" fill="#222">  block (feeds the server prompt)</text>
  <text x="982" y="273" font-size="12" fill="#222">same-page pixel-hash LRU cache</text>
  <text x="982" y="290" font-size="12" fill="#222">  → unchanged step reuses map in 0 ms</text>
  <text x="982" y="309" font-size="12" fill="#222">fully local · ~1.4 s, parallel with faces/OCR</text>
  <line x1="944" y1="240" x2="964" y2="240" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="954" y="232" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b7280">escalate</text>

  <!-- 3 set-of-marks -->
  <rect x="582" y="352" width="360" height="120" rx="8" fill="#ffffff" stroke="#283593" stroke-width="2"/>
  <text x="598" y="376" font-size="13.5" font-weight="bold" fill="#283593">3  SET-OF-MARKS RENDER</text>
  <text x="598" y="398" font-size="12" fill="#222">draw numbered [N] tags onto the</text>
  <text x="598" y="415" font-size="12" fill="#222">sanitized image element corners</text>
  <text x="598" y="432" font-size="12" fill="#222">VLM targets integers — never coordinates</text>
  <line x1="942" y1="412" x2="964" y2="412" stroke="#283593" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 zero-leak -->
  <rect x="966" y="352" width="322" height="120" rx="8" fill="#fdecec" stroke="#b62835" stroke-width="2"/>
  <text x="982" y="376" font-size="13.5" font-weight="bold" fill="#b62835">4  ZERO-LEAK — FAIL-CLOSED</text>
  <text x="982" y="398" font-size="12" fill="#222">regex scan over outbound DOM JSON</text>
  <text x="982" y="415" font-size="12" fill="#222">OCR re-read of the sanitized pixels</text>
  <text x="982" y="432" font-size="12" font-weight="bold" fill="#b62835">any hit OR gate error → BLOCK upload</text>

  <!-- 5 send -->
  <rect x="120" y="486" width="340" height="34" rx="17" fill="#e0e7ff" stroke="#283593" stroke-width="1.5"/>
  <text x="122" y="508" font-size="12.5" font-weight="bold" fill="#283593">5  SEND — only sanitized bytes cross</text>
  <line x1="1110" y1="472" x2="1110" y2="503" stroke="#283593" stroke-width="1.5"/>
  <line x1="1110" y1="503" x2="466" y2="503" stroke="#283593" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- boundary -->
  <line x1="46" y1="610" x2="1414" y2="610" stroke="#b62835" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1404" y="600" text-anchor="end" font-size="12.5" font-weight="bold" font-style="italic" fill="#b62835">PRIVACY BOUNDARY — raw PII never crosses</text>

  <!-- send arrow down to server -->
  <line x1="290" y1="520" x2="290" y2="628" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arblu)"/>
  <text x="302" y="546" font-size="11.5" font-weight="bold" font-style="italic" fill="#0d6efd">ONLY redacted JPEG + numbered DOM</text>

  <!-- ============ SERVER BAND ============ -->
  <rect x="46" y="632" width="1368" height="300" rx="14" fill="#e9f3ff" stroke="#0d6efd" stroke-width="2.5"/>
  <text x="66" y="660" font-size="15" font-weight="bold" fill="#0d6efd">LOCAL SERVER — FastAPI + Ollama on 127.0.0.1 (no internet · no API keys)</text>

  <rect x="62" y="678" width="362" height="180" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="78" y="700" font-size="13.5" font-weight="bold" fill="#0d6efd">FASTAPI (Python)</text>
  <text x="78" y="720" font-size="12" fill="#222">/act · /act/stream (SSE thinking)</text>
  <text x="78" y="737" font-size="12" fill="#222">/rethink · /warm · /health · /models</text>
  <text x="78" y="754" font-size="12" fill="#222">prompt: sanitized image + DOM +</text>
  <text x="78" y="771" font-size="12" fill="#222">  ON-DEVICE PERCEPTION block</text>
  <text x="78" y="788" font-size="12" fill="#222">resolve_target coerces [6] · 6.0 · <tspan fill="#111">[a]</tspan> → id</text>
  <text x="78" y="805" font-size="12" fill="#222">stream one-retry-with-fix-hint</text>
  <text x="78" y="822" font-size="12" fill="#222">structural repeat-veto signatures</text>
  <text x="78" y="839" font-size="12" fill="#222">keep_alive=-1 · num_ctx 4096 · temp 0</text>
  <line x1="424" y1="768" x2="446" y2="768" stroke="#0d6efd" stroke-width="2" marker-end="url(#arblu)"/>

  <rect x="448" y="678" width="310" height="180" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="464" y="700" font-size="13.5" font-weight="bold" fill="#0d6efd">PERCEPTION ROUTING</text>
  <text x="464" y="720" font-size="12" fill="#222">server/routing.py · opt-in env</text>
  <text x="464" y="737" font-size="12" fill="#222">MobileViT map → 3b / 7b choice</text>
  <text x="464" y="754" font-size="12" fill="#222">interactive steps → 3b (fast)</text>
  <text x="464" y="771" font-size="12" fill="#222">read / report / captcha → 7b</text>
  <text x="464" y="788" font-size="12" fill="#222">complex visual pages → big</text>
  <text x="464" y="805" font-size="12" fill="#222">client override always wins</text>
  <text x="464" y="822" font-size="12" fill="#222">low-memory fallback on judge GPU</text>
  <text x="464" y="839" font-size="12" fill="#222">race-safe while serving a step</text>
  <line x1="758" y1="768" x2="780" y2="768" stroke="#0d6efd" stroke-width="2" marker-end="url(#arblu)"/>

  <rect x="782" y="678" width="606" height="180" rx="8" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="798" y="700" font-size="13.5" font-weight="bold" fill="#0d6efd">OLLAMA — QWEN2.5-VL 3b / 7b (local VLM)</text>
  <text x="798" y="720" font-size="12" fill="#222">local · no API keys · model stays resident</text>
  <text x="798" y="737" font-size="12" fill="#222">reads ONLY the sanitized image + numbered DOM</text>
  <text x="798" y="754" font-size="12" fill="#222">returns exactly ONE JSON action + thought</text>
  <text x="798" y="771" font-size="12" fill="#222">click · type · press · scroll · navigate · wait</text>
  <text x="798" y="788" font-size="12" fill="#222">extract · done · subgoal · blocked</text>
  <text x="798" y="805" font-size="12" fill="#222">image ≤ 800 px · JPEG q80 · max_tokens 128</text>
  <text x="798" y="822" font-size="12" fill="#222">gate can only act on redacted bytes</text>
  <text x="798" y="839" font-size="12" fill="#222">keep_alive=-1 → next step starts warm</text>
  <text x="798" y="856" font-size="11.5" font-style="italic" fill="#0d6efd">~5.6–13 s/step local · &lt;5 s target on judge GPU</text>

  <text x="62" y="906" font-size="12" font-style="italic" fill="#0d6efd">RECOVERY: stuck / repeated / blocked → /rethink structurally vetoes repeats → untried-element escape hatch →</text>
  <text x="62" y="922" font-size="12" font-style="italic" fill="#0d6efd">never returns “done” just to escape the loop.</text>

  <!-- JSON return -->
  <line x1="1215" y1="858" x2="1215" y2="950" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arblu)"/>
  <text x="1227" y="896" font-size="12" font-weight="bold" fill="#0d6efd">ONLY JSON action — no pixels sent back</text>

  <!-- ============ EXECUTE STRIP ============ -->
  <rect x="46" y="954" width="1368" height="116" rx="14" fill="#e8f7ee" stroke="#15803d" stroke-width="2.5"/>
  <text x="66" y="980" font-size="15" font-weight="bold" fill="#15803d">9  EXECUTE — GUARDED, IN THE ACTIVE TAB</text>
  <line x1="1215" y1="954" x2="1215" y2="970" stroke="#15803d" stroke-width="2" marker-end="url(#argrn)"/>
  <rect x="62" y="990" width="1336" height="68" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="78" y="1012" font-size="12" fill="#222">background → content script: resolve element ID · scroll into view · virtual cursor → pointer/keyboard events</text>
  <text x="78" y="1031" font-size="12" fill="#222">React-safe typing (execCommand) · auto-descend into the real &lt;input&gt; · remember verified targets</text>
  <text x="78" y="1050" font-size="12" font-weight="bold" fill="#15803d">GUARDS: http(s) navigation only · non-http form-action refused · file-input clicks never · DO-NOT-MODIFY write veto on redacted corners (card / PAN / email)</text>

  <!-- ============ LOOP BACK ============ -->
  <polyline points="1420,300 1452,300 1452,1000 1426,1000" fill="none" stroke="#283593" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="1474" y="650" transform="rotate(90 1474 650)" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">loop — repeat until done=true</text>

  <!-- ============ LEGEND ============ -->
  <rect x="62" y="1086" width="14" height="14" fill="#283593"/>
  <text x="82" y="1098" font-size="12" fill="#111">On-device (extension)</text>
  <rect x="238" y="1086" width="14" height="14" fill="#0d6efd"/>
  <text x="258" y="1098" font-size="12" fill="#111">Local server / VLM</text>
  <rect x="400" y="1086" width="14" height="14" fill="#b62835"/>
  <text x="420" y="1098" font-size="12" fill="#111">Fail-closed privacy enforcement</text>
  <rect x="620" y="1086" width="14" height="14" fill="#15803d"/>
  <text x="640" y="1098" font-size="12" fill="#111">Guarded execution</text>
  <text x="1408" y="1098" text-anchor="end" font-size="12" font-style="italic" fill="#444">All local · 0 MB cloud · PII F1 0.984 · zero-leak PASS · 3/3 VLM tasks · 27/27 guard tests</text>
</svg>