<!doctype html>
<html><head><meta charset="utf-8"/><title>PII in SVG</title>
<style>body{font-family:system-ui;margin:16px;background:#111827;color:#e5e7eb}
svg{border:1px solid #374151;border-radius:8px;background:#fff;margin:0 16px 16px 0}</style></head>
<body>
<h2>Id cards (inline SVG)</h2>
<svg width="340" height="180">
  <rect width="340" height="180" fill="#fdf6ec"/>
  <rect x="10" y="10" width="320" height="160" rx="8" fill="#fff" stroke="#dd9000"/>
  <text x="26" y="46" font-family="monospace" font-size="15" fill="#555">PRIYA PAL</text>
  <text x="26" y="80" font-family="monospace" font-size="14" fill="#333">Voter: ABC1234567</text>
  <text x="26" y="108" font-family="monospace" font-size="16" fill="#000">3452 1987 6543</text>
  <text x="26" y="140" font-family="monospace" font-size="13" fill="#666">DL: MH-01-2023-4567890</text>
</svg>
<svg width="300" height="150">
  <rect width="300" height="150" fill="#eef4ff"/>
  <text x="20" y="42" font-family="monospace" font-size="18" fill="#1d4ed8">K1234567</text>
  <text x="20" y="80" font-family="monospace" font-size="14" fill="#111">UPI 9876543210@okaxis</text>
  <text x="20" y="112" font-family="monospace" font-size="14" fill="#333">priya.pal@example.co.in</text>
</svg>
</body></html>
